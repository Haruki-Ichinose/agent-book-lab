[project]
name = "agent-book-lab"
version = "0.1.0"
description = "Personal hands-on environment for learning local RAG and AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.27.2",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "langchain-core==0.3.0",
    "langchain-openai==0.2.0",
    "langgraph==0.2.22",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["agent_book"]

[tool.ruff]
line-length = 100
target-version = "py311"
